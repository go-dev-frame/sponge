version: "2"
run:
  timeout: 5m
  tests: false
linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - goconst
    - gocyclo
    - goprintffuncname
    - govet
    - lll
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        logger:
          deny:
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package.
    dogsled:
      max-blank-identifiers: 2
    dupl:
      threshold: 100
    errorlint:
      asserts: false
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 4
      min-occurrences: 4
      # Keep v1 behavior for calls and literal tables used by the generator.
      exclude-types:
        - Call
        - CompositeLit
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    godox:
      keywords:
        - FIXME
    govet:
      enable:
        - nilness
        - shadow
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 200
    misspell:
      locale: US
      ignore-rules:
        - importas
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: indent-error-flow
        - name: argument-limit
          arguments:
            - 8
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: function-result-limit
          arguments:
            - 3
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    staticcheck:
      # Match the previous staticcheck and gosimple linters; omit new style and quick-fix checks.
      checks:
        - SA*
        - S*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Service initialization deliberately owns command-line flag parsing.
      - linters:
          - revive
        path: ^cmd/[^/]+/initial/initApp\.go$
        text: 'deep-exit: calls to flag.Parse'
      # These public cipher APIs retain their existing ciphertext formats for compatibility.
      - linters:
          - staticcheck
        path: pkg/gocrypto/rsa.go
        text: 'SA1019: crypto/rsa\.(Encrypt|Decrypt)PKCS1v15'
      - linters:
          - staticcheck
        path: pkg/gocrypto/wcipher/mode.go
        text: 'SA1019: crypto/cipher\.New(CFBEncrypter|CFBDecrypter|OFB)'
      # Migrating Director to Rewrite changes forwarding-header behavior; keep the current API behavior.
      - linters:
          - staticcheck
        path: pkg/proxykit/backend.go
        text: 'SA1019: \(net/http/httputil.ReverseProxy\).Director'
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: (.+)_test\.go
      - linters:
          - staticcheck
        path: pkg/golinters/gofumpt/gofumpt.go
        text: 'SA1019: settings.LangVersion is deprecated: use the global `run.go` instead.'
      - linters:
          - staticcheck
        path: pkg/golinters/internal/staticcheck_common.go
        text: 'SA1019: settings.GoVersion is deprecated: use the global `run.go` instead.'
      - linters:
          - staticcheck
        path: pkg/lint/lintersdb/manager.go
        text: 'SA1019: (.+).(GoVersion|LangVersion) is deprecated: use the global `run.go` instead.'
      - linters:
          - gocritic
        path: pkg/golinters/unused/unused.go
        text: 'rangeValCopy: each iteration copies 160 bytes \(consider pointers or indexing\)'
      - linters:
          - gosec
        path: pkg/goanalysis/runner_loadingpackage.go
        text: 'G115: integer overflow conversion uintptr -> int'
      - linters:
          - gosec
        path: test/bench/bench_test.go
        text: 'G115: integer overflow conversion int -> int32'
      - linters:
          - gosec
        path: test/bench/bench_test.go
        text: 'G115: integer overflow conversion uint64 -> int'
    paths:
      - .*_test\.go$
      - docs
      - api
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/go-dev-frame/sponge
  exclusions:
    generated: lax
    paths:
      - .*_test\.go$
      - docs
      - api
      - third_party$
      - builtin$
      - examples$
